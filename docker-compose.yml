services:
  mezzi-app:
    build: .
    container_name: mezzi-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/mezzi.db
      PORT: 3000
    # Solo localhost: l'unico ingresso da internet è il tunnel Cloudflare.
    ports:
      - "127.0.0.1:${PORT:-8430}:3000"
    volumes:
      - mezzi-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mezzi-data:
    name: mezzi-data
